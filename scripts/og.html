<!doctype html>
<!--
  Source for public/og.png — the 1200x630 card shown when the site's link is
  shared. Re-render it after changing anything here (needs Chrome):

    chrome --headless=new --disable-lcd-text --hide-scrollbars
      --window-size=1200,630 --virtual-time-budget=5000
      --allow-file-access-from-files
      --screenshot=public/og.png scripts/og.html

  (one command; wrapped here for reading)
-->
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Anton";
    src: url("../node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Instrument Serif";
    font-style: italic;
    src: url("../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2") format("woff2");
  }
  @font-face {
    font-family: "Space Grotesk";
    font-weight: 400;
    src: url("../node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-400-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Space Grotesk";
    font-weight: 700;
    src: url("../node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-700-normal.woff2") format("woff2");
  }
  html, body {
    margin: 0; width: 1200px; height: 630px; overflow: hidden;
    background: #000; color: #fff;
    font-family: "Space Grotesk", sans-serif; -webkit-font-smoothing: antialiased;
  }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle at center, rgba(255,255,255,0.085) 1px, transparent 1.5px);
    background-size: 36px 36px;
    -webkit-mask-image: radial-gradient(ellipse 100% 95% at 50% 45%, #000 30%, rgba(0,0,0,0.55) 68%, transparent 92%);
  }
  .vinyl { position: absolute; left: -250px; bottom: -250px; width: 620px; height: 620px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.3);
    background: radial-gradient(circle, transparent 58%, rgba(255,255,255,0.04) 100%); }
  .vinyl i { position: absolute; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); }
  .top, .bottom { position: absolute; left: 56px; right: 56px; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; }
  .top { top: 46px; font-size: 15px; letter-spacing: 0.35em; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 700; }
  .eq { display: flex; align-items: flex-end; gap: 3px; height: 16px; }
  .eq i { width: 3.5px; background: #fff; }
  .muted { color: #a3a3a3; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-top: 6px; }
  .label { margin-bottom: 26px; font-size: 14px; letter-spacing: 0.55em; text-transform: uppercase; color: #8a8a8a; }
  h1 { position: relative; margin: 0; font-family: "Anton"; font-weight: 400; font-size: 190px; line-height: 0.84; letter-spacing: 0.01em; text-transform: uppercase; }
  h1 span { display: block; }
  .outline { color: transparent; -webkit-text-stroke: 2.5px #fff; }
  h1 .script {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-5deg);
    white-space: nowrap; font-family: "Instrument Serif"; font-style: italic; font-size: 86px; letter-spacing: 0; text-transform: lowercase;
    filter: drop-shadow(0 4px 24px rgba(0,0,0,0.9));
  }
  .bottom { bottom: 42px; font-size: 13px; letter-spacing: 0.35em; }
</style>

<div class="dots"></div>
<div class="vinyl">
  <i style="inset: 40px"></i><i style="inset: 80px"></i>
  <i style="inset: 128px; border-style: dashed; border-color: rgba(255,255,255,0.3)"></i><i style="inset: 176px"></i>
</div>

<div class="top">
  <div class="brand">
    <span class="eq"><i style="height: 45%"></i><i style="height: 100%"></i><i style="height: 65%"></i><i style="height: 85%"></i></span>
    adimakesmusic
  </div>
  <div class="muted">singer — live</div>
</div>

<div class="center">
  <div class="label">( sound on ) — vol. 01</div>
  <h1>
    <span>Aditya</span>
    <span class="outline">Chowhan</span>
    <span class="script">makes&nbsp;music</span>
  </h1>
</div>

<div class="bottom">
  <span class="muted">black &amp; white — until you press play</span>
  <span>adimakesmusic.in</span>
</div>
