# The booking server — see worker/src/index.ts and the "pay:*" scripts in package.json.
name = "adimakesmusic-pay"
main = "src/index.ts"
compatibility_date = "2025-10-01"

[vars]
ALLOWED_ORIGINS = "https://adimakesmusic.in,https://www.adimakesmusic.in"
# How many paid bookings fill a date. A filled date can't be booked online.
BOOKINGS_PER_DAY = "1"

# RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET and DASHBOARD_PASSWORD are NOT here, and
# must never be: this repository is public. They're stored encrypted on
# Cloudflare by:  npm run pay:setup
